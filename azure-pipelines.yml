trigger:
- main

pool:
  name: default

stages:
- stage: DeployAzure
  displayName: "Deploy to Azure Portal"
  jobs:
  - job: AzureDeployJob
    displayName: "Azure Deployment Job"
    steps:
    - script: |
        echo "1️⃣ Creando Resource Group..."
        echo "Resource Group: RG-Practica5"
      displayName: "Create Resource Group"

    - script: |
        echo "2️⃣ Creando App Service Plan..."
        echo "App Service Plan: Plan-Practica5"
      displayName: "Create App Service Plan"

    - script: |
        echo "3️⃣ Creando Aplicación Web..."
        echo "Web App: WebApp-Practica5"
      displayName: "Create App Service"

    - script: |
        echo "4️⃣ Creando Base de Datos Elastic..."
        echo "DB: DB-Practica5"
      displayName: "Create Elastic Database"

    - script: |
        echo "5️⃣ Configurando conexión a Docker Hub..."
        echo "Usuario: TU_USUARIO_DOCKER"
      displayName: "DockerHub Connection"

    - script: |
        echo "6️⃣ Desplegando backend y frontend..."
        echo "Simulando deploy de contenedores a Web App"
      displayName: "Deploy Containers"

    - script: |
        echo "✅ Pipeline completo. Tomar screenshots de cada paso para evidencia."
      displayName: "Finalize Pipeline"
